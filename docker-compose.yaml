services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build: ./backend
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend/backend:/app
      - ./media:/app/media
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - 8000
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    expose:
      - 4200
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "npm install && npx ng serve --host 0.0.0.0 --poll=2000"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    working_dir: /app
    ports: [ "80:80" ]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist/frontend/browser:/var/www/html
      - ./media:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  node_modules:


