services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build: ./backend
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend/backend:/app
      - ./media:/app/media
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - 8000
    depends_on:
      - db

  nginx:
    image: nginx:latest
    working_dir: /app
    ports: [ "80:80" ]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist/frontend/browser:/var/www/html
      - ./media:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:


