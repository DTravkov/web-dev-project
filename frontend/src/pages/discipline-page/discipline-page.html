<div class="main-div col">
    <h2 class="discipline-name">{{discipline()?.name}}</h2>
    <div class="form-div">
        <textarea rows="5" [(ngModel)]="currentComment" (ngModelChange)="clearErrorMsg()"
            class="comment-form"></textarea>
        <div class="row-center-space-between w100">
            <app-star-rating-component [clickedCount]="this.currentRating()" [numberOfStars]="5"
                (clickedEvent)="onRatingChanged($event)"></app-star-rating-component>
            @if(errorMsg()){
            <p class="error-msg">{{errorMsg()}}</p>
            }

            <button class="comment-btn" (click)="onCommentSubmit()">
                <p>Отправить</p>
            </button>
        </div>
    </div>
    <div class="comments-div">
        @for(comment of commentsArr(); track $index){
        <app-comment-component [commentData]="comment" class="comment" (likeEvent)="onLikeClicked($event)"
            (dislikeEvent)="onDislikeClicked($event)"></app-comment-component>
        }
    </div>





</div>
