<div class="header">
    <div class="row" style="justify-content: space-between;">
        <div class="row baseline">
            <div class="dropdown">
                <a class="btn" [routerLink]="['/disciplines']">Disciplines</a>
                <div class="dropdown-content">
                    <a [routerLink]="['/disciplines']">Discipline List</a>
                    <a [routerLink]="['/disciplines/offer']">Offer new Discipline</a>
                </div>
            </div>

            <div class="dropdown">
                <a class="btn" [routerLink]="['/professors']">Professors</a>
                <div class=" dropdown-content">
                    <a [routerLink]="['/professors']">Professor List</a>
                    <a [routerLink]="['/professors/offer']">Offer new Professor</a>
                </div>
            </div>

            <a [routerLink]="['/donate']" class="btn">Donations ;3</a>
        </div>
        @if(this.auth.isLoggedIn()){
        <p style="color: white;">Добро пожаловать!
        </p>
        <div class="btn" (click)="onLogoutClicked()">Logout</div>
        }
        @else{
        <div class="row baseline">
            <p>{{errMessage()}}</p>
            <input type="text" [(ngModel)]="login" class="field" placeholder="Login">
            <input type="text" [(ngModel)]="password" class="field" placeholder="Password" type="password">
            <div class="btn" (click)="onLoginClicked()">Login</div>
            <div class="btn" (click)="onSignupClicked()">Signup</div>
        </div>
        }

    </div>

</div>
